name: Sync Main to Backend & Deploy

on:
  workflow_dispatch:

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Add backend remote
        run: |
          git remote add upstream https://x-access-token:${{ secrets.BACKEND_TOKEN }}@github.com/Mr70da/autours22.git

      - name: Fetch backend branch
        run: |
          git fetch upstream Back-70da

      - name: Merge latest backend changes
        run: |
          git merge upstream/Back-70da --no-edit

      - name: Push to backend
        run: |
          git push upstream HEAD:Back-70da

      - name: Trigger Deploy
        run: |
          curl "${{ secrets.DEPLOY_URL }}"